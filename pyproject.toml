[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energypilot"
version = "0.1.0"
description = "5G EnergyPilot AI: a research prototype studying LLM-based orchestration of energy decision models for a simulated 5G base station."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pulp>=2.8,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.20"]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["energypilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that run several closed-loop simulations with the MILP solver",
]
