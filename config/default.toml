# 5G EnergyPilot AI - default configuration.
#
# All values are modelling ASSUMPTIONS for a synthetic study; none is a measurement
# of a real site. Units are part of the key names (_kw = power, _kwh = energy,
# _pct = percent of battery capacity, _hour = clock hour from 00:00).
# These defaults mirror energypilot/config/settings.py (checked by a test).

[simulation]
time_step_minutes = 15          # control / accounting step (dt = 0.25 h)
horizon_hours = 24              # step 0 starts at 00:00

[battery]
capacity_kwh = 40.0             # usable nameplate energy
soc_min_pct = 10.0              # BMS lower limit (hard)
soc_max_pct = 95.0              # BMS upper limit (hard)
initial_soc_pct = 60.0          # before per-seed jitter (see [scenario])
max_charge_kw = 10.0            # AC-side charging power limit
max_discharge_kw = 10.0         # AC-side discharging power limit
charge_efficiency = 0.95        # E += eta_ch * P_ch * dt
discharge_efficiency = 0.95     # E -= P_dis * dt / eta_dis
self_discharge_pct_per_day = 0.0
degradation_cost_eur_per_kwh = 0.02   # throughput cost used by the optimiser

[pv]
peak_power_kw = 6.0             # AC output at solar noon, clear sky
sunrise_hour = 6.5
sunset_hour = 20.5
shape_exponent = 1.5            # clear-sky shape: sin(pi * x) ** exponent

[weather]
ar_coefficient = 0.9            # AR(1) persistence of cloud attenuation
[weather.classes.sunny]
mean = 0.95
std = 0.03
[weather.classes.partly_cloudy]
mean = 0.70
std = 0.15
[weather.classes.overcast]
mean = 0.30
std = 0.08

[base_station]
# P_bs = fixed + capacity_power * c + traffic_power * min(traffic, c)
fixed_power_kw = 1.2            # baseband, cooling, transport, rectifier losses
capacity_power_kw = 1.0         # radio units idle power at full capacity (c = 1)
traffic_power_kw = 2.0          # load-dependent amplifier power at full served traffic
min_capacity_fraction = 0.4     # coverage layer only (deepest energy-saving mode)
ran_auto_wakeup = true          # RAN re-activates capacity if traffic > active capacity

[grid]
max_import_kw = 15.0            # physical connection limit

[tariff]
# Illustrative time-of-use tariff (EUR/kWh). Not a real commercial offer.
[[tariff.periods]]
start_hour = 0
end_hour = 6
price_eur_per_kwh = 0.15
label = "off-peak"
[[tariff.periods]]
start_hour = 6
end_hour = 17
price_eur_per_kwh = 0.21
label = "standard"
[[tariff.periods]]
start_hour = 17
end_hour = 21
price_eur_per_kwh = 0.32
label = "peak"
[[tariff.periods]]
start_hour = 21
end_hour = 22
price_eur_per_kwh = 0.21
label = "standard"
[[tariff.periods]]
start_hour = 22
end_hour = 24
price_eur_per_kwh = 0.15
label = "off-peak"

[traffic]
# Normalised traffic: 1.0 = full radio capacity of the site (all layers active).
baseline = 0.10
noise_std = 0.06                # multiplicative log-normal AR(1) noise
noise_ar = 0.8
max_traffic = 1.3
[[traffic.peaks]]
center_hour = 9.0
width_hours = 1.6
amplitude = 0.32
[[traffic.peaks]]
center_hour = 13.5
width_hours = 2.2
amplitude = 0.38
[[traffic.peaks]]
center_hour = 20.5
width_hours = 2.0
amplitude = 0.62

[qos]
# QoS proxy: maximum radio utilisation (traffic / active capacity) per level.
[qos.max_utilization_by_level]
strict = 0.70
standard = 0.85
relaxed = 0.95

[scenario]
initial_soc_jitter_pct = 5.0    # uniform +/- jitter on the initial SoC per seed

[forecast]
mode = "persistence_corrected"  # or "perfect" (oracle reference)
pv_decay_per_step = 0.85
traffic_decay_per_step = 0.90

[optimizer]
solver = "CBC"                  # bundled with PuLP; "HiGHS" needs highspy
time_limit_s = 10.0
battery_mode_binaries = true    # MILP: forbid simultaneous charge and discharge
replan_interval_steps = 4       # MPC re-planning period (4 x 15 min = 1 h)
terminal_soc_penalty_eur_per_kwh = 0.40   # soft: end-of-day SoC below initial
curtailment_penalty_eur_per_kwh = 0.001   # tie-breaker against wasting PV
secondary_cost_weight = 0.01    # cost weight when the objective is not cost

[rule_controller]
peak_price_threshold_eur_per_kwh = 0.30
offpeak_price_threshold_eur_per_kwh = 0.16
offpeak_charge_target_pct = 50.0
offpeak_charge_power_kw = 5.0
reserve_precharge_margin = 1.3

[agent]
max_orchestration_turns = 8
llm_timeout_s = 30.0
max_tokens = 1500
max_instruction_chars = 1000

[safety]
power_tolerance_kw = 0.001
energy_tolerance_kwh = 0.001
capacity_tolerance = 0.0001
